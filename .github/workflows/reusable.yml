name: usegit reusable

on:
  workflow_call:
    inputs:
      tool_ref:
        description: usegit Git ref to execute
        required: false
        type: string
        default: main
      runs_on:
        description: GitHub Actions runner label for the target repository
        required: false
        type: string
        default: ubuntu-latest
      runner_shell:
        description: Shell available on the selected runner
        required: false
        type: string
        default: bash

jobs:
  causal-history:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout usegit
        uses: actions/checkout@v4
        with:
          repository: Pom4H/usegit
          ref: ${{ inputs.tool_ref }}
          path: .usegit-runtime

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure evidence transport
        shell: ${{ inputs.runner_shell }}
        run: node .usegit-runtime/src/cli.mjs setup

      - name: Validate causal history
        shell: ${{ inputs.runner_shell }}
        run: node .usegit-runtime/src/cli.mjs validate

      - name: Build causal report
        shell: ${{ inputs.runner_shell }}
        run: node .usegit-runtime/src/cli.mjs report > usegit-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: usegit-report
          path: usegit-report.json

      - name: Configure evidence author
        if: ${{ github.event_name == 'push' }}
        shell: ${{ inputs.runner_shell }}
        run: git config user.name "usegit[bot]"

      - name: Configure evidence email
        if: ${{ github.event_name == 'push' }}
        shell: ${{ inputs.runner_shell }}
        run: git config user.email "usegit[bot]@users.noreply.github.com"

      - name: Fetch prior usegit evidence
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        shell: ${{ inputs.runner_shell }}
        run: git fetch origin refs/notes/usegit:refs/notes/usegit

      - name: Materialize CI evidence
        if: ${{ github.event_name == 'push' }}
        shell: ${{ inputs.runner_shell }}
        run: node .usegit-runtime/src/note.mjs "${{ github.sha }}" "success"

      - name: Push usegit evidence
        if: ${{ github.event_name == 'push' }}
        shell: ${{ inputs.runner_shell }}
        run: git push origin refs/notes/usegit
