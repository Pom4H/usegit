name: usegit

on:
  push:
    branches:
      - main
      - "experiment/**"
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: npm run report > usegit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: usegit-report
          path: usegit-report.json

  blind-replay-fixtures:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/experiment/causal-memory-v0' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch anonymous histories
        run: |
          git fetch origin refs/heads/bench/granularity/a-v1:refs/heads/blind-a
          git fetch origin refs/heads/bench/granularity/b-v1:refs/heads/blind-b
          git fetch origin refs/heads/bench/granularity/c-v1:refs/heads/blind-c
      - name: Verify identical final trees
        run: |
          expected="$(git rev-parse blind-a^{tree})"
          test "$expected" = "$(git rev-parse blind-b^{tree})"
          test "$expected" = "$(git rev-parse blind-c^{tree})"
          test "$expected" = "8aaf353048cfa4f516c288459a3cd80ffed1deea"
      - name: Build isolated replay fixtures
        run: |
          mkdir -p blind-replay
          for alias in a b c; do
            bare="/tmp/usegit-${alias}.git"
            workspace="/tmp/usegit-${alias}"
            check="/tmp/check-${alias}"

            git init --bare "$bare"
            git push "$bare" "refs/heads/blind-${alias}:refs/heads/main"
            git -C "$bare" symbolic-ref HEAD refs/heads/main

            git -C "$bare" bundle create "$GITHUB_WORKSPACE/blind-replay/granularity-${alias}.bundle" main
            git -C "$bare" bundle verify "$GITHUB_WORKSPACE/blind-replay/granularity-${alias}.bundle"

            git clone --quiet "$bare" "$workspace"
            git -C "$workspace" remote remove origin
            test "$(git -C "$workspace" branch --show-current)" = "main"
            test -z "$(git -C "$workspace" remote)"
            test "$(git -C "$workspace" rev-parse HEAD^{tree})" = "8aaf353048cfa4f516c288459a3cd80ffed1deea"

            (cd "$workspace" && zip -qr "$GITHUB_WORKSPACE/blind-replay/granularity-${alias}.zip" .)

            mkdir -p "$check"
            unzip -q "$GITHUB_WORKSPACE/blind-replay/granularity-${alias}.zip" -d "$check"
            test "$(git -C "$check" branch --show-current)" = "main"
            test -z "$(git -C "$check" remote)"
            test "$(git -C "$check" rev-parse HEAD^{tree})" = "8aaf353048cfa4f516c288459a3cd80ffed1deea"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: granularity-blind-replay
          path: |
            blind-replay/*.bundle
            blind-replay/*.zip

  provenance:
    if: ${{ always() && github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch existing evidence notes
        run: git fetch origin refs/notes/usegit:refs/notes/usegit || true
      - name: Materialize CI evidence
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          git config user.name "usegit[bot]"
          git config user.email "usegit[bot]@users.noreply.github.com"
          node src/note.mjs "$GITHUB_SHA" "$VALIDATION_RESULT"
      - name: Push evidence DAG
        run: git push origin refs/notes/usegit
